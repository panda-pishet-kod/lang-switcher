[package]
name = "lang_switcher"
version = "0.87.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Two targets on purpose. Integration tests under tests\ can only link against a library
# target, so a bin-only crate would make that directory useless and force a rebuild of the
# crate layout at stage E3. Decision R-11.
[lib]
name = "lang_switcher"
path = "src/lib.rs"

# The binary is named LangSwitcher, which produces LangSwitcher.exe. Fixed by decision 6 and
# already hard-wired into the LangSw-Install scheduled task; it must not be renamed.
[[bin]]
name = "LangSwitcher"
path = "src/main.rs"

# The end-to-end acceptance bench of SPEC section 11.5. Task T-04-3.
#
# The entry point is deliberately named e2e.rs and not main.rs: cargo auto-discovers
# tests\*\main.rs as an integration test, which would build and run the bench — and with it
# Microsoft Word — on every `cargo test`. The name e2e.rs is not subject to that discovery,
# and this section is the only way the bench is ever built.
#
# required-features is not decoration either: without it `cargo build` of the shipping
# configuration would try to build the bench, which links against the `testing`-only module
# `control`, and the product build would fail.
[[bin]]
name = "langsw-e2e"
path = "tests/e2e/e2e.rs"
required-features = ["testing"]

# The full dependency list of SPEC section 3.2, all four crates at once. serde and toml are
# only needed by task T-01-3, but filling Cargo.toml in one go keeps it from becoming a
# shared edit point between tasks that run in parallel. Decision R-14.
#
# The list is closed: adding any crate outside it requires a decision from the user. That is
# the enforcement mechanism behind SEC-03, not a preference.
[dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_TextServices",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Performance",
  "Win32_System_IO",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_UI_Controls",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  # FR-102 and SEC-03, вопрос 101 п. 3, полномочие П2 («да») — **the only two features this
  # program has ever added for a purpose other than a window**, and they are the whole of what
  # the author's feed needs:
  #
  #   Win32_Networking_WinHttp     — one GET, no more often than once in fifteen days
  #   Win32_Security_Cryptography  — the ECDSA P-256 signature of the file, checked by CNG
  #
  # ⚠ **Crates: none added.** The list of section 3.2 is closed, and SEC-03 is enforced by
  # exactly that: `cargo tree` stays at 83 lines and criterion 4 of section 13 checks it.
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[build-dependencies]
embed-resource = "3.0.11"

# SEC-04a: the debug control channel compiles only under this feature, and the feature is
# absent from the Release configuration. Acceptance criterion 8 of SPEC section 13 checks
# that the shipped binary carries no trace of it.
[features]
testing = []

# Carried over verbatim from SPEC section 3.2.
#
# ⭐ Task T-41-12, finding Н134, решение 125.2 added `debug-assertions`. This section turns off
# two mechanisms of the program, and until that task only ONE of the two keys said so:
#
#   panic = "abort"          turns off the panic guard of FR-99 (src\hook.rs, #[cfg(panic =
#                            "unwind")]) -- and it was written down
#   debug-assertions = false turns off the self-termination of FR-97 (src\app.rs,
#                            #[cfg(debug_assertions)] over `mod debug_timeout`) -- and it was
#                            NOT, standing instead on cargo's default for this profile
#
# The asymmetry was the whole of the finding. Somebody turning debug assertions on in the
# release profile to chase a bug, and forgetting to turn them off, would ship a resident
# program that quietly exits after ten minutes -- and no instrument would have noticed, because
# the acceptance read the mechanism out of the SOURCE and not out of the built file. Criterion 8
# of section 13 now looks for `LANGSW_DEBUG_TIMEOUT_SEC` in the binary itself.
#
# ⚠ The list of `[features]` and the list of crates are closed (SEC-03); this section is not one
# of them -- it is carried over from SPEC section 3.2 word for word, and решение 125.2 authorises
# exactly this one line.
[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
panic            = "abort"
strip            = true
debug-assertions = false
