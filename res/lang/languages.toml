# res/lang/languages.toml -- the registry of the languages of the interface. Stage L10N, task T-L10N-4.
#
# One entry per language: the fourteen the program ships (group "shipped", the order of
# `Language::ALL`) and the fifty of decisions 198.13/198.14 -- group A (28: own script or switched
# with Russian all the time) and group B (22: Latin with letters of its own), in the order of
# reports/LANGUAGES-UI-TRANSLATION-2026-10-27.md of the control folder.
#
#   tag            the value of `[general] language` and the `[item.<tag>]` of the feed
#   locale         the Windows locale of the interface language (table 198.13)
#   langid         its LANGID, measured on the host: LocaleNameToLCID(locale) and back
#                  LCIDToLocaleName (scratchpad-L10N/measure-langid.ps1, 69 of 69 round trips);
#                  the LANGUAGE statement of res/lang/<tag>.rc says the same number
#   name_en        what Windows calls the language in English (LOCALE_SENGLISHLANGUAGENAME)
#   endonym        the name in the language chooser. For "shipped" -- `Language::native_name`,
#                  character for character (tests/l10n.rs). For "planned" -- what Windows calls it
#                  in itself (LOCALE_SNATIVELANGUAGENAME), first letter capital: a proposal the
#                  translator confirms
#   script         ISO 15924, as Windows reports it (LOCALE_SSCRIPTS)
#   rtl            right to left (LOCALE_IREADINGLAYOUT = 1)
#   inno           the name of the language of the installer, as the file installer/lang/<inno>.isl
#   inno_official  Inno Setup 6.7.3 ships a translation of its own messages (Languages/<inno>.isl)
#   group          shipped | A | B
#   state          shipped | planned
#   note           only where a choice is the owner's (TZ L10N, decision 6): the value written is
#                  the one of the Windows interface, the alternatives are measured and listed
#
# ⚠ `language` of the configuration is a closed set (SPEC section 7): a new value raises
# `schema_version`, once per stage of translations -- not here (TZ L10N, decision 7).

